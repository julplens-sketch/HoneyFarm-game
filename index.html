<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoneyFarm - Spin Wheel</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
body{background:#FFEB3B;font-family:Arial;padding:12px;margin:0}
.card{background:white;border-radius:16px;padding:14px;margin-bottom:12px;text-align:center}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;font-size:16px;margin-top:8px}
.btn-yellow{background:#FFC107}
.btn-green{background:#4CAF50;color:white}
.btn-purple{background:#9C27B0;color:white}
.btn-orange{background:#FF9800;color:white}
.leader-row{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee;text-align:left}
.rank{background:#FFC107;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold}
#wheelModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:999;align-items:center;justify-content:center;flex-direction:column}
#wheel{width:280px;height:280px;border-radius:50%;border:8px solid #FFC107;background:conic-gradient(#FFEB3B 0deg 45deg,#FFC107 45deg 90deg,#FF9800 90deg 135deg,#4CAF50 135deg 180deg,#9C27B0 180deg 225deg,#E91E63 225deg 270deg,#03A9F4 270deg 315deg,#8BC34A 315deg 360deg);position:relative;transition:transform 3s cubic-bezier(0.25,0.1,0.25,1);display:flex;align-items:center;justify-content:center}
#wheelCenter{width:60px;height:60px;background:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px;border:4px solid #333;z-index:10}
#pointer{width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid red;position:absolute;top:-10px;left:50%;transform:translateX(-50%);z-index:20}
.rewardText{color:white;font-size:18px;font-weight:bold;margin-top:20px}
</style>
</head>
<body>
<div class="card">
<h2>🍯 HoneyFarm 🐝</h2>
<h1 id="honeyCount">0</h1>
<p>Top 1 Weekly: <b>1,000 GCASH</b></p>
<button id="adBtn" class="btn btn-yellow" onclick="watchAdForHoney()">📺 Watch Ad +20k Honey</button>
<button class="btn btn-green" onclick="farmHoney()">👆 Farm +10 Honey</button>
<button class="btn btn-purple" onclick="openWheel()">🎡 SPIN WHEEL - WIN up to 100k!</button>
</div>

<div id="wheelModal" onclick="if(event.target==this)closeWheel()">
<div id="pointer"></div>
<div id="wheel"><div id="wheelCenter">🍯</div></div>
<div class="rewardText" id="wheelResult">Pindota SPIN!</div>
<button class="btn btn-orange" id="spinBtn" onclick="spinWheel()" style="width:200px;margin-top:16px">🎡 SPIN NOW (2k Honey)</button>
<button class="btn" style="width:200px;background:white" onclick="closeWheel()">Close</button>
</div>

<div class="card"><h3>🏆 Top Honey</h3><div id="leaderHoney"></div></div>
<div class="card"><h3>👥 Top Invite</h3><div id="leaderInvite"></div></div>

<script>
let honey=parseInt(localStorage.getItem('honey')||'393383');
let invites=JSON.parse(localStorage.getItem('invites')||'[]');
function save(){localStorage.setItem('honey',honey);localStorage.setItem('invites',JSON.stringify(invites));updateUI();}
function addHoney(n){honey+=n;save();}
function farmHoney(){addHoney(10);}
function updateUI(){document.getElementById('honeyCount').innerText=honey.toLocaleString()+" 🍯";renderBoards();}
let AdController=null;
try{AdController=window.Adsgram.init({blockId:"int-57059"});}catch(e){try{AdController=window.Adsgram.init({blockId:"57059"})}catch{}}
async function watchAdForHoney(){
 let b=document.getElementById('adBtn'); b.disabled=true; b.innerText=' Loading...';
 try{ if(AdController){ await AdController.show(); } }catch(e){}
 addHoney(20000); b.disabled=false; b.innerText='📺 Watch Ad +20k Honey';
}
function renderBoards(){
 let demo=[{name:'You',honey:honey,invites:invites.length,isYou:true},{name:'@crypto_king',honey:12450,invites:89},{name:'@bee_master',honey:9800,invites:64},{name:'@honey_lover',honey:7650,invites:42},{name:'@gen_santos',honey:3210,invites:21}];
 let byHoney=[...demo].sort((a,b)=>b.honey-a.honey);
 document.getElementById('leaderHoney').innerHTML=byHoney.map((u,i)=>`<div class="leader-row" style="${u.isYou?'background:#FFF8B0;border-radius:8px':''}"><div style="display:flex;gap:8px;align-items:center"><div class="rank">${i+1}</div>${u.name}</div><div><b>${u.honey.toLocaleString()} 🍯</b></div></div>`).join('');
 let byInvite=[...demo].sort((a,b)=>b.invites-a.invites);
 document.getElementById('leaderInvite').innerHTML=byInvite.map((u,i)=>`<div class="leader-row" style="${u.isYou?'background:#FFF8B0;border-radius:8px':''}"><div style="display:flex;gap:8px;align-items:center"><div class="rank">${i+1}</div>${u.name}</div><div><b>${u.invites} 👥</b></div></div>`).join('');
}
function openWheel(){document.getElementById('wheelModal').style.display='flex';}
function closeWheel(){document.getElementById('wheelModal').style.display='none';}
let spinning=false;
function spinWheel(){
 if(spinning) return;
 if(honey<2000){alert("Kulang honey boss! Need 2k para spin! Farm sa or Watch Ad!");return;}
 spinning=true; honey-=2000; save();
 let btn=document.getElementById('spinBtn'); btn.disabled=true; btn.innerText=' Spinning...';
 let rewards=[1000,5000,10000,20000,50000,100000,2000,15000];
 let randomReward=rewards[Math.floor(Math.random()*rewards.length)];
 let spins=5*360 + Math.floor(Math.random()*360);
 document.getElementById('wheel').style.transform=`rotate(${spins}deg)`;
 setTimeout(()=>{
   addHoney(randomReward);
   document.getElementById('wheelResult').innerText=`BOOM! +${randomReward.toLocaleString()} Honey! 🍯🔥`;
   btn.disabled=false; btn.innerText=`🎡 SPIN AGAIN (2k)`;
   spinning=false;
   setTimeout(()=>{if(randomReward>=50000) alert(`JACKPOT BOSS! +${randomReward.toLocaleString()} Honey! 🎉🔥`);},500);
 },3000);
}
updateUI();
if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}
</script>
</body>
</html>
