<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoneyFarm - +20k Ads</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
body{background:#FFEB3B;font-family:Arial;padding:12px;margin:0}
.card{background:white;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:bold;font-size:16px;cursor:pointer}
.btn-yellow{background:#FFC107}
.btn-green{background:#4CAF50;color:white}
.leader-row{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee}
.rank{background:#FFC107;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold}
</style>
</head>
<body>
<div class="card" style="text-align:center">
<h2>🍯 HoneyFarm 🐝</h2>
<h1 id="honeyCount">0 🍯</h1>
<p>Top 1 Weekly: <b>1,000 GCASH</b></p>
<button id="adBtn" class="btn btn-yellow" onclick="watchAdForHoney()">📺 Watch Ad +20k Honey</button>
<br><br>
<button class="btn btn-green" onclick="farmHoney()">👆 Farm +10 Honey</button>
</div>

<div class="card">
<h3>🏆 Top Honey</h3>
<div id="leaderHoney">Loading...</div>
</div>

<div class="card">
<h3>👥 Top Invite</h3>
<div id="leaderInvite">Loading...</div>
</div>

<div class="card">
<h3>Your Invites</h3>
<div id="inviteList">No invites yet</div>
<button class="btn btn-green" style="margin-top:10px" onclick="inviteFriend()">📤 Invite Friend +50</button>
</div>

<script>
let honey = parseInt(localStorage.getItem('honey')||'0');
let invites = JSON.parse(localStorage.getItem('invites')||'[]');

function save(){localStorage.setItem('honey',honey);localStorage.setItem('invites',JSON.stringify(invites));updateUI();}

function addHoney(n){honey+=n;save();}

function farmHoney(){addHoney(10);}

function updateUI(){
 document.getElementById('honeyCount').innerText=honey.toLocaleString()+" 🍯";
 renderBoards();
}

function inviteFriend(){
 let name="Friend_"+Math.floor(Math.random()*999);
 invites.push({name:name});
 addHoney(50);
 alert("Invited "+name+" +50 Honey!");
}

// ADSGRAM BLOCK 57059 - +20k
let AdController=null;
try{AdController=window.Adsgram.init({blockId:"int-57059"});}catch(e){try{AdController=window.Adsgram.init({blockId:"57059"})}catch{}}

async function watchAdForHoney(){
 let b=document.getElementById('adBtn');
 b.disabled=true;
 b.innerText=' Loading...';
 try{
  if(AdController){await AdController.show();alert("BOOM! +20,000 Honey!");addHoney(20000);}
  else{throw "no ad";}
 }catch(e){
  alert("Ad preview +20,000 muna! Live sa Telegram!");
  addHoney(20000);
 }
 b.disabled=false;
 b.innerText='📺 Watch Ad +20k Honey';
}

function renderBoards(){
 let demo=[
  {name:'You',honey:honey,invites:invites.length,isYou:true},
  {name:'@crypto_king',honey:12450,invites:89},
  {name:'@bee_master',honey:9800,invites:64},
  {name:'@honey_lover',honey:7650,invites:42},
  {name:'@gen_santos',honey:3210,invites:21}
 ];
 let byHoney=[...demo].sort((a,b)=>b.honey-a.honey);
 document.getElementById('leaderHoney').innerHTML=byHoney.map((u,i)=>`<div class="leader-row" style="${u.isYou?'background:#FFF8B0;border-radius:8px':''}"><div style="display:flex;gap:8px;align-items:center"><div class="rank">${i+1}</div>${u.name}</div><div><b>${u.honey.toLocaleString()} 🍯</b></div></div>`).join('');
 let byInvite=[...demo].sort((a,b)=>b.invites-a.invites);
 document.getElementById('leaderInvite').innerHTML=byInvite.map((u,i)=>`<div class="leader-row" style="${u.isYou?'background:#FFF8B0;border-radius:8px':''}"><div style="display:flex;gap:8px;align-items:center"><div class="rank">${i+1}</div>${u.name}</div><div><b>${u.invites} 👥</b></div></div>`).join('');
 document.getElementById('inviteList').innerHTML=invites.length?invites.map(f=>`<div class="leader-row"><div>👤 ${f.name}</div><div>+50 🍯</div></div>`).join(''):'<div style="opacity:.6;text-align:center;padding:10px">No invites yet - Share link!</div>';
}
updateUI();
if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();}
</script>
</body>
</html>
