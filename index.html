<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoneyFarm 🐝</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<style>
body{margin:0;background:#FFEB3B;font-family:Arial;overflow:hidden}
.header{background:#FFC107;padding:10px;display:flex;justify-content:space-between}
.hive{width:200px;height:200px;background:radial-gradient(#FFC107,#FF9800);border-radius:50%;margin:20px auto;border:6px solid #795548;display:flex;align-items:center;justify-content:center;font-size:80px;animation:float 2s infinite;cursor:pointer}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.btn{padding:12px;border:none;border-radius:10px;font-weight:bold;width:100%;margin:5px 0;cursor:pointer}
.btn-yellow{background:#FFC107;color:#000}.btn-green{background:#4CAF50;color:#fff}.btn-blue{background:#2196F3;color:#fff}
.card{background:white;border-radius:12px;padding:10px;margin:8px;box-shadow:0 2px 5px rgba(0,0,0,0.2)}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;z-index:999}
.modal-content{background:white;border-radius:12px;padding:15px;width:90%;max-width:350px}
input{width:100%;padding:10px;margin:5px 0;border:1px solid #ccc;border-radius:8px;box-sizing:border-box}
</style>
</head>
<body>
<div class="header">
<div><b>🍯 <span id="honeyCount">0</span></b><br><small style="font-size:10px" id="userIdDisplay"></small></div>
<div><small>Pets: <span id="petRate">0</span>/h</small><br><button onclick="openConvert()" style="padding:4px 8px;background:#4CAF50;color:white;border:none;border-radius:6px;font-size:11px">Convert GCash</button></div>
</div>
<div class="hive" onclick="tapHive()">🍯</div>
<div style="text-align:center"><b id="tapText">Tap to collect!</b><br><small>+20 honey per tap</small></div>
<div class="card">
<b>🐝 Bee Pets</b>
<button class="btn btn-yellow" onclick="buyPet('worker',100000,1000)">Worker Bee - 100k (1k/h) - Own: <span id="workerCount">0</span></button>
<button class="btn btn-yellow" onclick="buyPet('queen',500000,6000)">Queen Bee - 500k (6k/h) - Own: <span id="queenCount">0</span></button>
<button class="btn btn-yellow" onclick="buyPet('mega',2000000,30000)">Mega Hive - 2M (30k/h) - Own: <span id="megaCount">0</span></button>
</div>
<div class="card">
<button class="btn btn-green" onclick="watchAd()">📺 Watch Ad +20k Honey (3/day)</button>
<small id="adStatus">Ads: 0/3 today</small>
<button class="btn btn-blue" onclick="inviteFriend()" style="margin-top:8px">👥 Invite Friends (+50k)</button>
</div>
<div class="card"><b>🏆 Leaderboard</b><div id="leaderboard" style="font-size:12px;margin-top:5px">Loading...</div></div>
<div id="convertModal" class="modal">
<div class="modal-content">
<h3 style="margin:0">💰 Convert to GCash</h3>
<p style="font-size:11px">Min 50 GCash = 50M Honey | 1M = 1 GCash</p>
<input id="gcashNum" placeholder="09xxxxxxxxx GCash Number">
<input id="gcashAmount" type="number" placeholder="Amount (Min 50)">
<p style="font-size:11px">Your Honey: <b id="modalHoney">0</b></p>
<button class="btn btn-green" onclick="doConvert()">Convert Now</button>
<button class="btn" onclick="closeConvert()" style="background:#ccc">Cancel</button>
</div>
</div>
<script>
let tg=window.Telegram?.WebApp;let USER_ID='guest_'+Math.floor(Math.random()*1000000);let USER_NAME='Player';
if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user){USER_ID='tg_'+tg.initDataUnsafe.user.id;USER_NAME=tg.initDataUnsafe.user.first_name||'Player';tg.expand();}
document.getElementById('userIdDisplay').innerText=USER_ID+' | ADS: int-57202 LIVE!';
let honey=parseInt(localStorage.getItem('honeyfarm_'+USER_ID+'_honey')||'0');
let pets=JSON.parse(localStorage.getItem('honeyfarm_'+USER_ID+'_pets')||'{"worker":0,"queen":0,"mega":0}');
let withdrawals=JSON.parse(localStorage.getItem('honeyfarm_'+USER_ID+'_withdraw')||'[]');
let adCount=parseInt(localStorage.getItem('honeyfarm_'+USER_ID+'_adCount')||'0');
let adDate=localStorage.getItem('honeyfarm_'+USER_ID+'_adDate')||'';
let leaderboard=JSON.parse(localStorage.getItem('honeyfarm_leaderboard')||'[]');
const BOT_TOKEN='9248559819:AAHA5pmTalZmZFrIvSVEqDMUFp6fxk5N7SI';const ADMIN_CHAT_ID='7362404968';const AD_BLOCK_ID='int-57202';
function save(){localStorage.setItem('honeyfarm_'+USER_ID+'_honey',honey);localStorage.setItem('honeyfarm_'+USER_ID+'_pets',JSON.stringify(pets));localStorage.setItem('honeyfarm_'+USER_ID+'_withdraw',JSON.stringify(withdrawals));localStorage.setItem('honeyfarm_'+USER_ID+'_adCount',adCount);localStorage.setItem('honeyfarm_'+USER_ID+'_adDate',adDate);localStorage.setItem('honeyfarm_leaderboard',JSON.stringify(leaderboard));updateUI();}
function updateUI(){document.getElementById('honeyCount').innerText=honey.toLocaleString();document.getElementById('modalHoney').innerText=honey.toLocaleString();let rate=pets.worker*1000+pets.queen*6000+pets.mega*30000;document.getElementById('petRate').innerText=rate.toLocaleString();document.getElementById('workerCount').innerText=pets.worker;document.getElementById('queenCount').innerText=pets.queen;document.getElementById('megaCount').innerText=pets.mega;document.getElementById('adStatus').innerText=`Ads: ${adCount}/3 today - ID: ${USER_ID} | ADS: ${AD_BLOCK_ID} LIVE!`;let idx=leaderboard.findIndex(p=>p.id===USER_ID);if(idx>=0)leaderboard[idx].honey=honey;else leaderboard.push({id:USER_ID,name:USER_NAME,honey:honey});leaderboard.sort((a,b)=>b.honey-a.honey);leaderboard=leaderboard.slice(0,20);let html='';leaderboard.forEach((p,i)=>{html+=`${i==0?'🥇':i==1?'🥈':i==2?'🥉':'#'+(i+1)} ${p.name} - ${p.honey.toLocaleString()}<br>`;});document.getElementById('leaderboard').innerHTML=html;}
function tapHive(){honey+=20;save();let t=document.getElementById('tapText');t.innerText='+20!';setTimeout(()=>{t.innerText='Tap to collect!';},300);}
function buyPet(type,cost,rate){if(honey<cost){alert('Kulang honey boss! Need '+cost.toLocaleString());return;}honey-=cost;pets[type]++;save();alert('Bought '+type+'! +'+rate+'/h');}
function openConvert(){document.getElementById('convertModal').style.display='flex';document.getElementById('modalHoney').innerText=honey.toLocaleString();}
function closeConvert(){document.getElementById('convertModal').style.display='none';}
function doConvert(){let num=document.getElementById('gcashNum').value.trim();let gcash=parseInt(document.getElementById('gcashAmount').value);if(!num||num.length<11){alert('Invalid GCash number!');return;}if(!gcash||gcash<50){alert('Min 50 GCash boss!');return;}let need=gcash*1000000;if(honey<need){alert('Kulang honey! Need '+need.toLocaleString()+' honey for '+gcash+' GCash. You have '+honey.toLocaleString());return;}honey-=need;withdrawals.push({honey:need,gcash:gcash,number:num,date:new Date().toLocaleString()});save();let msg=`💰 NEW CONVERT BOSS!%0A👤 Name: ${USER_NAME}%0A🆔 ID: ${USER_ID}%0A💵 GCash: ${gcash}%0A📱 Number: ${num}%0A🍯 Honey: ${need.toLocaleString()}%0A⏰ ${new Date().toLocaleString()}`;fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${ADMIN_CHAT_ID}&text=${msg}`).then(r=>console.log('Admin notified')).catch(e=>console.log('Notify fail',e));alert("Success! "+gcash+" GCash pending! Admin notified! Boss will send soon!");closeConvert();}
function watchAd(){let today=new Date().toDateString();if(adDate!==today){adCount=0;adDate=today;}if(adCount>=3){alert('Limit 3 ads per day boss! Balik ugma!');return;}try{if(window.Adsgram){let AdController=window.Adsgram.init({blockId:AD_BLOCK_ID});AdController.show().then(()=>{honey+=20000;adCount++;save();alert('+20k honey from Ad!');}).catch(()=>{honey+=20000;adCount++;save();alert('+20k honey! (Ad not available but honey added)');});}else{honey+=20000;adCount++;save();alert('+20k honey! (Fallback)');}}catch(e){honey+=20000;adCount++;save();alert('+20k honey! (Fallback)');}}
function inviteFriend(){let link=`https://t.me/Honeyfarmget_bot/app?startapp=${USER_ID}`;if(navigator.clipboard)navigator.clipboard.writeText(link);alert('Invite link copied! Share to friends: '+link+'\\n+50k per invite!');}
setInterval(()=>{let rate=pets.worker*1000+pets.queen*6000+pets.mega*30000;if(rate>0){honey+=Math.floor(rate/3600);document.getElementById('honeyCount').innerText=honey.toLocaleString();localStorage.setItem('honeyfarm_'+USER_ID+'_honey',honey);}},1000);
updateUI();
</script>
</body>
</html>
